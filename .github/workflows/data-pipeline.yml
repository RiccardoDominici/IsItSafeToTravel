name: Daily Data Pipeline
# Marks the two kinds of manual run that must not count as the day's run (the guard job below
# reads these markers): a backfill for another date, and a corrective run that does not email
# the newsletter.
run-name: >-
  Daily Data Pipeline${{ inputs.date && format(' for {0}', inputs.date) || '' }}${{ inputs.skip_digest && ' (no digest)' || '' }}

on:
  schedule:
    # Several slots, and the first one GitHub actually delivers does the day's run; the guard
    # job turns the later ones into no-ops. Why: GitHub's scheduler is best-effort and a single
    # 06:00 UTC cron fired 4–8 hours late through Sept–Oct 2026 (October: 10:13–14:34 UTC, i.e.
    # the newsletter after lunch in Italy). The slots are early on purpose, so the usual delay
    # lands the run in the morning. The 23:17 slot normally arrives after midnight UTC and
    # serves the NEXT day; if it arrives on time, today's run has already succeeded and it
    # skips. Off the top of the hour, as GitHub advises. Owner decision (2026-10-21): everything
    # stays on GitHub, no external scheduler holding a GitHub token.
    - cron: '17 23 * * *'
    - cron: '17 1 * * *'
    - cron: '17 3 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      date:
        description: 'Date override (YYYY-MM-DD, leave empty for today)'
        required: false
        type: string
      skip_digest:
        # For corrective re-runs (data-revision fixes, same-day regenerations):
        # the 2026-09-25 correction run emailed subscribers 7 "new" severe
        # advisories that were artifacts of a repaired source, not news.
        description: 'Do not email the daily digest for this run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One pipeline at a time: a run that arrives while another is going waits for it instead of
# racing it to the data commit, and its guard then sees how the first one ended.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  guard:
    # Only the first scheduled slot GitHub delivers each day runs the pipeline (see
    # on.schedule): a scheduled run is skipped when today (UTC) already has a successful daily
    # run, i.e. one that is not a backfill or a no-digest corrective run (run-name markers).
    # Manual dispatches always run. Fails open: if the runs cannot be listed, run the pipeline;
    # a duplicate run is harmless (the digest is idempotent via digest_log), a missed day is not.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is today's daily run already done?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SLOT: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Which slot this is and when GitHub delivered it, to keep measuring the delay.
          echo "Scheduled slot '${SLOT}' delivered at $(date -u +%H:%M) UTC." | tee -a "$GITHUB_STEP_SUMMARY"
          SINCE="$(date -u +%Y-%m-%d)T00:00:00Z"
          if ! RUNS=$(gh api "repos/${REPO}/actions/workflows/data-pipeline.yml/runs?status=success&per_page=100&created=%3E%3D${SINCE}"); then
            echo "::warning::could not list today's runs; running the pipeline anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DONE=$(echo "$RUNS" | jq -r --argjson self "$RUN_ID" '[.workflow_runs[] | select(.id != $self) | select(.display_title | test(" for [0-9]{4}-[0-9]{2}-[0-9]{2}|\\(no digest\\)") | not)] | .[0] // empty | "\(.id) (\(.event), \(.created_at))"')
          if [ -n "$DONE" ]; then
            echo "Today's daily run already succeeded: run $DONE. Skipping this late scheduled run."
            echo "Skipped: today's daily run already succeeded (run $DONE)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful daily run since $SINCE: running the pipeline."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    needs: guard
    # Runs unless the guard positively said "already done": a guard that crashed leaves the
    # output empty, and then the pipeline runs (fail open).
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # 45, not 30: on 2026-10-15 the Spanish ministry's site alone took 14 minutes (usually ~3)
    # and the job finished at 27 of 30 minutes; a timeout skips the data commit, deploy and digest.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data pipeline
        run: npx tsx src/pipeline/run.ts ${{ github.event.inputs.date || '' }} 2>&1 | tee pipeline-output.log
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Staleness monitor (src/pipeline/staleness.ts) pushes to ntfy only when this is set.
          # Local runs and tests leave it unset, so they never send a notification.
          NTFY_TOPIC: riccardo-claude
        continue-on-error: true
        id: pipeline

      - name: Generate fetch summary
        if: always()
        run: |
          echo "## Fetch Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f pipeline-output.log ]; then
            # Extract the summary line
            SUMMARY_LINE=$(grep -o 'Total: [0-9]* sources.*Duration: [0-9.]*s' pipeline-output.log || echo "")
            if [ -n "$SUMMARY_LINE" ]; then
              echo "**${SUMMARY_LINE}**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Report failed sources as GitHub warnings
            FAILED=$(grep '^\s*FAILED:' pipeline-output.log || true)
            if [ -n "$FAILED" ]; then
              echo "### Failed Sources" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$FAILED" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"

              # Emit GitHub Actions warnings for each failed source
              echo "$FAILED" | while IFS= read -r line; do
                SOURCE=$(echo "$line" | sed 's/.*FAILED: \([^ ]*\).*/\1/')
                echo "::warning::Advisory source failed: ${SOURCE}"
              done
            else
              echo "All sources fetched successfully." >> "$GITHUB_STEP_SUMMARY"
            fi

            # Staleness monitor (src/pipeline/staleness.ts): one warning per source that is
            # behind its cycle, and a note when a new INFORM edition was stored this run.
            STALE=$(grep '^\[STALENESS\] VIOLATION' pipeline-output.log || true)
            if [ -n "$STALE" ]; then
              echo "### Data staleness" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$STALE" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$STALE" | while IFS= read -r line; do
                echo "::warning::${line#\[STALENESS\] }"
              done
            fi
            NEW_EDITION=$(grep '^\[STALENESS\] NEW INFORM edition' pipeline-output.log || true)
            if [ -n "$NEW_EDITION" ]; then
              echo "**${NEW_EDITION#\[STALENESS\] }**" >> "$GITHUB_STEP_SUMMARY"
            fi

            # Report successful sources
            OK_COUNT=$(grep -c '^\s*OK:' pipeline-output.log || echo "0")
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Successful sources:** ${OK_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pipeline output log not found"
          fi

      - name: Check pipeline output
        run: |
          if [ -f "data/scores/latest.json" ]; then
            echo "Pipeline produced output"
            COUNTRY_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/scores/latest.json','utf8')); console.log(d.countries.length)")
            echo "Countries scored: $COUNTRY_COUNT"

            # Write job summary
            echo "## Daily Pipeline Results" >> $GITHUB_STEP_SUMMARY
            # Label with the run date (the dispatch override when set), not the wall clock:
            # a corrective run for 2026-09-25 started after UTC midnight was reported as 2026-09-26.
            RUN_DATE="${{ github.event.inputs.date }}"; RUN_DATE="${RUN_DATE:-$(date -u +%Y-%m-%d)}"
            echo "- **Date:** $RUN_DATE" >> $GITHUB_STEP_SUMMARY
            echo "- **Countries scored:** $COUNTRY_COUNT" >> $GITHUB_STEP_SUMMARY

            if [ "$COUNTRY_COUNT" -lt 100 ]; then
              echo "::warning::Only $COUNTRY_COUNT countries scored (expected 180+)"
              echo "- **Warning:** Low country count — some sources may have failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::error::Pipeline did not produce output"
            echo "## Daily Pipeline Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** FAILED — no output produced" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Copy scores to public
        run: cp data/scores/latest.json public/scores.json

      - name: Verify data quality (regression guards)
        id: quality
        run: |
          set -e
          SNAP="public/scores.json"

          fail() { echo "::error::DATA QUALITY: $1"; FAILURES="${FAILURES}\n- $1"; }
          warn() { echo "::warning::DATA QUALITY: $1"; WARNINGS="${WARNINGS}\n- $1"; }

          FAILURES=""
          WARNINGS=""

          # Base advisories the fetcher DROPPED under the 7-day fallback rule (fetchers/
          # advisory-fallback.ts, owner decision 2026-10-15): the issuer is meant to be absent
          # today, so its JPN and coverage checks below warn instead of blocking the publish.
          # The staleness monitor has already pushed the ntfy alert for it.
          RUN_DATE="${{ github.event.inputs.date }}"; RUN_DATE="${RUN_DATE:-$(date -u +%Y-%m-%d)}"
          FALLBACK_FILE="data/raw/${RUN_DATE}/advisories-fallback.json"
          DROPPED=""
          if [ -f "$FALLBACK_FILE" ]; then
            DROPPED=$(jq -r '[.issuers[] | select(.state=="dropped") | .issuer] | join(" ")' "$FALLBACK_FILE")
          fi
          is_dropped() { case " $DROPPED " in *" $1 "*) return 0;; esac; return 1; }

          # Country count
          N=$(jq '.countries | length' "$SNAP")
          if [ "$N" -lt 200 ]; then fail "country count $N < 200"; fi

          # JPN must have US/UK/CA/AU advisories (US silently broke 2026-05-27)
          for src in us uk ca au; do
            present=$(jq ".countries[] | select(.iso3==\"JPN\") | .advisories.${src} != null" "$SNAP")
            if [ "$present" != "true" ]; then
              if is_dropped "$src"; then warn "JPN.advisories.${src} is null: ${src^^} dropped by the 7-day fallback rule (see $FALLBACK_FILE)";
              else fail "JPN.advisories.${src} is null (fetcher regression)"; fi
            fi
          done

          # JPN must NOT be flagged Level 4 by NL (Fukushima sub-region promotion regression)
          jpn_nl=$(jq '.countries[] | select(.iso3=="JPN") | .advisories.nl.level // 0' "$SNAP")
          if [ "$jpn_nl" -gt 2 ]; then fail "JPN NL advisory level=$jpn_nl > 2 (NL parser regression)"; fi

          # JPN must NOT be flagged Level 3+ by DE (Teilreisewarnung sub-region promotion regression)
          jpn_de=$(jq '.countries[] | select(.iso3=="JPN") | .advisories.de.level // 0' "$SNAP")
          if [ "$jpn_de" -gt 2 ]; then fail "JPN DE advisory level=$jpn_de > 2 (DE partialWarning regression)"; fi

          # Core-source coverage: a scoring source that silently vanished must never be published.
          # 2026-10-15 (run 38711757500): the GPI fetch fell back to its 2012 edition, the 5-year
          # rule dropped it, and every score went out without the Global Peace Index (gpi=0 here,
          # all others normal). Floors ~90% of the coverage on that day: gpi 162, inform 191,
          # vdem 174, worldbank 215, ucdp 197. Counted from each country's `sources`, i.e. after
          # the max-age filter, so a stale edition counts as missing too.
          # worldbank 190 -> 107 with formula v10.1: a source is listed only when it supplies a
          # scored value (scoring/coverage.ts), so the World Bank now counts the 119 places with a
          # homicide rate from 2021 or later, not the 215 with any World Bank row.
          for pair in gpi:145 inform:170 vdem:155 worldbank:107 ucdp:175; do
            src="${pair%%:*}"; min="${pair##*:}"
            have=$(jq "[.countries[] | select(any(.sources[]?; .name==\"${src}\"))] | length" "$SNAP")
            if [ "$have" -lt "$min" ]; then fail "${src} covers ${have} countries < ${min} (scoring source missing from the scores)"; fi
          done

          # Formula v10.1: INFORM's lack-of-coping column turns natural-hazard exposure into risk.
          # Without it (a cached inform-parsed.json from before the column, a layout change) the
          # pillar would quietly score exposure only, so it is a core input like the sources above:
          # at least 90% of the places with inform_natural must carry inform_coping (engine.ts
          # MIN_COPING_COVERAGE_SHARE; the engine also logs an [INFORM] ERROR). Read from the raw
          # file the engine scored, dated by the snapshot itself.
          INFORM_RAW="data/raw/$(jq -r '.date' "$SNAP")/inform-parsed.json"
          if [ -f "$INFORM_RAW" ]; then
            nat=$(jq '[.indicators[] | select(.indicatorName=="inform_natural") | .countryIso3] | unique | length' "$INFORM_RAW")
            cop=$(jq '([.indicators[] | select(.indicatorName=="inform_natural") | .countryIso3] | unique) as $n | [.indicators[] | select(.indicatorName=="inform_coping") | .countryIso3 | select(. as $c | $n | index($c))] | unique | length' "$INFORM_RAW")
            if [ $((cop * 10)) -lt $((nat * 9)) ]; then fail "INFORM coping capacity covers ${cop} of ${nat} places < 90% (natural hazards would score exposure only)"; fi
          else
            fail "${INFORM_RAW} missing: cannot verify the INFORM coping column"
          fi

          # Per-source floors: each of US/UK/CA/AU should cover ≥150 countries
          for src in us uk ca au; do
            count=$(jq "[.countries[] | select(.advisories.${src} != null)] | length" "$SNAP")
            if [ "$count" -lt 150 ]; then
              if is_dropped "$src"; then warn "${src^^} advisory count $count < 150: dropped by the 7-day fallback rule (see $FALLBACK_FILE)";
              else fail "${src^^} advisory count $count < 150 (likely fetcher regression)"; fi
            fi
          done

          # No tier source aggregates should leak into the sources list
          tier_leak=$(jq '[.countries[] | .sources[] | select(.name | startswith("advisories_tier"))] | length' "$SNAP")
          if [ "$tier_leak" -gt 0 ]; then fail "tier source aggregates leaked into sources list ($tier_leak entries)"; fi

          # No source should have an empty url
          empty_url=$(jq '[.countries[] | .sources[] | select(.url == "")] | length' "$SNAP")
          if [ "$empty_url" -gt 0 ]; then fail "$empty_url source entries have empty url (anchor-rendering regression)"; fi

          # NL Level 4 false positive guard (was 62 across the world; should be <30 — only truly dangerous countries)
          nl_l4=$(jq '[.countries[] | select(.advisories.nl.level==4)] | length' "$SNAP")
          if [ "$nl_l4" -gt 30 ]; then warn "$nl_l4 countries flagged NL Level 4 — verify NL regex (typical baseline ≤30)"; fi

          # DE Level 3 guard. History: 27 false positives when partial (regional)
          # warnings were promoted to the whole country; ~0 after that fix. Since the
          # 2026-09-25 fetcher change, Level 3 is set only when the Auswärtiges Amt
          # text advises against travel to the WHOLE country ("wird (dringend)
          # abgeraten") — 13 countries on that date. A jump well above that means
          # regional wording is leaking into whole-country scope again.
          de_l3=$(jq '[.countries[] | select(.advisories.de.level==3)] | length' "$SNAP")
          if [ "$de_l3" -gt 20 ]; then warn "$de_l3 countries flagged DE Level 3 (13 on 2026-09-25) — verify whole-country scoping in fetchDeAdvisories"; fi

          # Echo to step summary
          {
            echo "## Data Quality Checks"
            echo ""
            echo "- Countries scored: **$N**"
            echo "- JPN advisories: US/UK/CA/AU present, NL=L${jpn_nl}, DE=L${jpn_de}"
            for src in us uk ca au; do
              c=$(jq "[.countries[] | select(.advisories.${src} != null)] | length" "$SNAP")
              echo "- ${src^^} advisory coverage: **$c countries**"
            done
            echo "- NL Level 4 countries (global): **$nl_l4**"
            echo "- DE Level 3 countries (global): **$de_l3**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Advisory-quality monitor (audit 2026-09-25) — WARN-ONLY, separate from the
          # hard pass/fail checks above. Emits its own ::warning:: lines and appends its
          # own Markdown summary straight to $GITHUB_STEP_SUMMARY. Runs before the
          # possible `exit 1` below so its findings are visible even on a hard failure;
          # `|| true` belt-and-suspenders on top of the script's own "always exit 0".
          npx tsx scripts/check-advisory-quality.ts "$SNAP" || true

          if [ -n "$FAILURES" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ❌ Quality failures" >> "$GITHUB_STEP_SUMMARY"
            printf "$FAILURES\n" >> "$GITHUB_STEP_SUMMARY"
            echo "quality_status=fail" >> "$GITHUB_OUTPUT"
            printf "failures<<EOF\n%s\nEOF\n" "$(printf "$FAILURES")" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -n "$WARNINGS" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ⚠️ Quality warnings" >> "$GITHUB_STEP_SUMMARY"
            printf "$WARNINGS\n" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "quality_status=ok" >> "$GITHUB_OUTPUT"

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/scores/ public/scores.json
          git add data/history/ 2>/dev/null || true
          git add data/sentiment/ 2>/dev/null || true
          git add data/news/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            DATE="${{ github.event.inputs.date }}"; DATE="${DATE:-$(date -u +%Y-%m-%d)}"
            git commit -m "data: update safety scores for $DATE

          Automated daily pipeline run.
          See data/scores/$DATE.json for details."
            # Retry the push: GitHub occasionally answers large data pushes with a
            # transient "remote rejected (Internal Server Error)" (seen 2026-09-30),
            # which used to fail the whole run and skip deploy + digest. Between
            # attempts, rebase onto origin in case master moved meanwhile.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::git push failed after $attempt attempts"
                exit 1
              fi
              DELAY=$((attempt * 20))
              echo "::warning::git push failed (attempt $attempt), retrying in ${DELAY}s"
              sleep "$DELAY"
              git pull --rebase origin master || { git rebase --abort 2>/dev/null; echo "::error::rebase onto origin/master failed"; exit 1; }
            done
          fi

      - name: Trigger deploy
        if: success()
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send daily digest
        if: success() && github.event.inputs.skip_digest != 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: npx tsx scripts/send-daily-digest.ts ${{ github.event.inputs.date || '' }}

      - name: Notify via ntfy
        if: always()
        env:
          QUALITY_STATUS: ${{ steps.quality.outputs.quality_status }}
          QUALITY_FAILURES: ${{ steps.quality.outputs.failures }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          # Run date = dispatch override when set (manual/corrective runs), else today (UTC).
          DATE="${{ github.event.inputs.date }}"; DATE="${DATE:-$(date -u +%Y-%m-%d)}"
          COUNTRY_COUNT="?"
          if [ -f "public/scores.json" ]; then
            COUNTRY_COUNT=$(jq '.countries | length' public/scores.json 2>/dev/null || echo "?")
          fi

          # Daily news events count (Stage 7 output). Non-blocking: missing file
          # (news engine is non-fatal) leaves NEWS_LINE empty.
          NEWS_LINE=""
          if [ -f "data/news/${DATE}.json" ]; then
            N_EVENTS=$(jq '.events | length' "data/news/${DATE}.json" 2>/dev/null || echo "")
            if [ "$N_EVENTS" = "0" ]; then
              NEWS_LINE="📰 News: quiet day, 0 events — digest skipped"
            elif [ -n "$N_EVENTS" ]; then
              NEWS_LINE="📰 News: ${N_EVENTS} event(s) today"
            fi
          fi

          # Community-vote daily report, appended to whichever notification fires.
          # Reads the sentiment D1 directly (same HTTP API + token fallback as
          # src/pipeline/sentiment/fetch-votes.ts) because the pipeline snapshot
          # only surfaces countries above the 5-vote floor. Non-blocking: any
          # failure leaves VOTES_LINE empty and the notification unchanged.
          VOTES_LINE=""
          D1_TOKEN="${CLOUDFLARE_D1_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_TOKEN" ]; then
            read -r -d '' VOTES_SQL <<'SQL' || true
          SELECT (SELECT COUNT(*) FROM votes) AS total,
                 (SELECT COUNT(*) FROM votes WHERE created_at > CAST(strftime('%s','now') AS INTEGER) - 86400) AS last24h
          SQL
            VOTES_JSON=$(jq -n --arg sql "$VOTES_SQL" '{sql: $sql}' \
              | curl -fsS -m 30 -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/83acaffe-32ff-43fc-b68f-5343d01000d5/query" \
                  -H "Authorization: Bearer ${D1_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data @- 2>/dev/null) || VOTES_JSON=""
            V_TOTAL=$(echo "$VOTES_JSON" | jq -r '.result[0].results[0].total // empty' 2>/dev/null)
            if [ -n "$V_TOTAL" ]; then
              V_24H=$(echo "$VOTES_JSON" | jq -r '.result[0].results[0].last24h // 0')
              VOTES_LINE="🗳 Votes: +${V_24H} last 24h (${V_TOTAL} total)"
            else
              echo "::warning::vote report query failed (non-blocking)"
            fi
          fi

          # Newsletter subscriber report, same pattern as the vote report above.
          # Non-blocking: any failure leaves SUBS_LINE empty.
          SUBS_LINE=""
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_TOKEN" ]; then
            read -r -d '' SUBS_SQL <<'SQL' || true
          SELECT (SELECT COUNT(*) FROM subscribers WHERE status='confirmed') AS confirmed,
                 (SELECT COUNT(*) FROM subscribers WHERE status='confirmed' AND confirmed_at > CAST(strftime('%s','now') AS INTEGER) - 604800) AS new7d,
                 (SELECT recipients FROM digest_log WHERE send_date = date('now')) AS sent_today
          SQL
            SUBS_JSON=$(jq -n --arg sql "$SUBS_SQL" '{sql: $sql}' \
              | curl -fsS -m 30 -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/83acaffe-32ff-43fc-b68f-5343d01000d5/query" \
                  -H "Authorization: Bearer ${D1_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data @- 2>/dev/null) || SUBS_JSON=""
            S_CONF=$(echo "$SUBS_JSON" | jq -r '.result[0].results[0].confirmed // empty' 2>/dev/null)
            if [ -n "$S_CONF" ]; then
              S_NEW7=$(echo "$SUBS_JSON" | jq -r '.result[0].results[0].new7d // 0')
              S_SENT=$(echo "$SUBS_JSON" | jq -r '.result[0].results[0].sent_today // empty')
              SUBS_LINE="📬 Newsletter: ${S_CONF} subscribers (+${S_NEW7} this week)"
              if [ -n "$S_SENT" ]; then
                SUBS_LINE="${SUBS_LINE} — digest sent to ${S_SENT}"
              else
                SUBS_LINE="${SUBS_LINE} — no digest today"
              fi
            else
              echo "::warning::subscriber report query failed (non-blocking)"
            fi
          fi

          # Estimated real visitors. The consent accept-rate (consent_log, fed by
          # CookieBanner.astro beacons) is the multiplier that turns consent-gated
          # Clarity sessions into an estimate of real traffic:
          #   real ≈ clarity_sessions / accept_rate.
          # Clarity sessions come from the Data Export API when CLARITY_API_TOKEN
          # is set (Clarity > Settings > Data Export > Generate new API token);
          # without it the line falls back to raw consent counts. Divisor uses the
          # 24h accept-rate when it has accepts, else the all-time rate.
          # Non-blocking: any failure leaves VISITORS_LINE empty.
          VISITORS_LINE=""
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_TOKEN" ]; then
            read -r -d '' CONSENT_SQL <<'SQL' || true
          SELECT (SELECT COUNT(*) FROM consent_log WHERE choice='granted' AND created_at > CAST(strftime('%s','now') AS INTEGER) - 86400) AS acc24,
                 (SELECT COUNT(*) FROM consent_log WHERE choice='denied'  AND created_at > CAST(strftime('%s','now') AS INTEGER) - 86400) AS den24,
                 (SELECT COUNT(*) FROM consent_log WHERE choice='granted') AS acc_all,
                 (SELECT COUNT(*) FROM consent_log WHERE choice='denied')  AS den_all
          SQL
            CONSENT_JSON=$(jq -n --arg sql "$CONSENT_SQL" '{sql: $sql}' \
              | curl -fsS -m 30 -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/83acaffe-32ff-43fc-b68f-5343d01000d5/query" \
                  -H "Authorization: Bearer ${D1_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data @- 2>/dev/null) || CONSENT_JSON=""
            C_ACC24=$(echo "$CONSENT_JSON" | jq -r '.result[0].results[0].acc24 // empty' 2>/dev/null)
            if [ -n "$C_ACC24" ]; then
              C_DEN24=$(echo "$CONSENT_JSON" | jq -r '.result[0].results[0].den24 // 0')
              C_ACC_ALL=$(echo "$CONSENT_JSON" | jq -r '.result[0].results[0].acc_all // 0')
              C_DEN_ALL=$(echo "$CONSENT_JSON" | jq -r '.result[0].results[0].den_all // 0')
              C_TOT24=$((C_ACC24 + C_DEN24))
              C_TOT_ALL=$((C_ACC_ALL + C_DEN_ALL))

              CL_SESS=""
              if [ -n "$CLARITY_API_TOKEN" ]; then
                CLARITY_JSON=$(curl -fsS -m 30 \
                    "https://www.clarity.ms/export-data/api/v1/project-live-insights?numOfDays=1" \
                    -H "Authorization: Bearer ${CLARITY_API_TOKEN}" 2>/dev/null) || CLARITY_JSON=""
                CL_SESS=$(echo "$CLARITY_JSON" | jq -r '[.[] | select(.metricName=="Traffic") | .information[0].totalSessionCount] | first // empty' 2>/dev/null)
                case "$CL_SESS" in (''|*[!0-9]*) CL_SESS="";; esac
                if [ -z "$CL_SESS" ]; then
                  echo "::warning::Clarity Data Export API call failed or returned no Traffic metric (non-blocking)"
                fi
              else
                echo "::notice::CLARITY_API_TOKEN not set — visitors line shows consent counts only, no Clarity estimate"
              fi

              RATE_ACC=""; RATE_TOT=""
              if [ "$C_ACC24" -gt 0 ]; then RATE_ACC=$C_ACC24; RATE_TOT=$C_TOT24
              elif [ "$C_ACC_ALL" -gt 0 ]; then RATE_ACC=$C_ACC_ALL; RATE_TOT=$C_TOT_ALL; fi

              if [ -n "$CL_SESS" ] && [ -n "$RATE_ACC" ]; then
                VISITORS_LINE="👥 Visitors: ~$((CL_SESS * RATE_TOT / RATE_ACC)) est. (Clarity ${CL_SESS} ÷ $((100 * RATE_ACC / RATE_TOT))% accept) — 24h consent: ${C_ACC24} accept / ${C_DEN24} reject"
              elif [ -n "$CL_SESS" ]; then
                VISITORS_LINE="👥 Visitors: Clarity ${CL_SESS} sessions (no accepts yet, estimate n/a) — 24h consent: ${C_ACC24} accept / ${C_DEN24} reject"
              else
                VISITORS_LINE="👥 Visitors: 24h consent ${C_ACC24} accept / ${C_DEN24} reject"
                if [ "$C_TOT24" -gt 0 ]; then
                  VISITORS_LINE="${VISITORS_LINE} ($((100 * C_ACC24 / C_TOT24))% accept)"
                fi
                if [ "$C_TOT_ALL" -gt 0 ]; then
                  VISITORS_LINE="${VISITORS_LINE} — all-time $((100 * C_ACC_ALL / C_TOT_ALL))% accept of ${C_TOT_ALL}"
                fi
              fi
            else
              echo "::warning::consent report query failed (non-blocking)"
            fi
          fi

          # On OK days the interesting content (visitors/votes/newsletter/news)
          # leads and the pipeline status is a one-line footer; on failures the
          # alarm detail stays on top.
          if [ "$JOB_STATUS" = "success" ] && [ "$QUALITY_STATUS" = "ok" ]; then
            TITLE="✅ Daily pipeline OK — $DATE"
            BODY=""
            PIPELINE_SUMMARY="✅ Pipeline: ${COUNTRY_COUNT} countries scored, quality checks passed, deploy triggered."
            PRIORITY="default"
            TAGS="white_check_mark,isitsafetotravel"
          elif [ "$QUALITY_STATUS" = "fail" ]; then
            TITLE="❌ Daily pipeline DATA REGRESSION — $DATE"
            BODY="Pipeline ran but data-quality checks failed:${QUALITY_FAILURES}\n\n${COUNTRY_COUNT} countries scored. ${RUN_URL}"
            PIPELINE_SUMMARY=""
            PRIORITY="high"
            TAGS="x,warning,isitsafetotravel"
          else
            TITLE="💥 Daily pipeline FAILED — $DATE"
            BODY="Pipeline workflow did not complete cleanly (status=$JOB_STATUS, pipeline-step=$PIPELINE_OUTCOME). Check the run log. ${RUN_URL}"
            PIPELINE_SUMMARY=""
            PRIORITY="high"
            TAGS="boom,isitsafetotravel"
          fi

          CONTENT=""
          for LINE in "$VISITORS_LINE" "$VOTES_LINE" "$SUBS_LINE" "$NEWS_LINE"; do
            if [ -n "$LINE" ]; then
              if [ -n "$CONTENT" ]; then CONTENT="${CONTENT}\n${LINE}"; else CONTENT="$LINE"; fi
            fi
          done
          if [ -n "$CONTENT" ]; then
            if [ -n "$BODY" ]; then BODY="${BODY}\n\n${CONTENT}"; else BODY="$CONTENT"; fi
          fi
          if [ -n "$PIPELINE_SUMMARY" ]; then
            if [ -n "$BODY" ]; then BODY="${BODY}\n\n${PIPELINE_SUMMARY}"; else BODY="$PIPELINE_SUMMARY"; fi
          fi

          # ntfy.sh push notification (per project memory: riccardo-claude topic)
          curl -fsS -X POST "https://ntfy.sh/riccardo-claude" \
            -H "Title: ${TITLE}" \
            -H "Priority: ${PRIORITY}" \
            -H "Tags: ${TAGS}" \
            -H "Click: ${RUN_URL}" \
            -d "$(printf '%b' "$BODY")" \
            || echo "::warning::ntfy notification failed (non-blocking)"

      - name: Cleanup
        if: always()
        run: rm -f pipeline-output.log
