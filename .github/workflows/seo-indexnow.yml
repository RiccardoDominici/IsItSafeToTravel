name: SEO IndexNow Submission (manual)

# Manual-only entry point for IndexNow. The automatic path now lives inside
# deploy.yml, run as a step right after "Deploy to Cloudflare Pages" — see
# scripts/indexnow/submit-changed.sh for why: this workflow used to trigger
# on `workflow_run` of that job, but GITHUB_TOKEN-dispatched deploy runs
# (i.e. every daily pipeline deploy since 2026-08-25) never fire that event,
# so it silently stopped running for 31 days straight. Removing the
# workflow_run trigger here also avoids a double-submission when a human
# pushes to master (deploy.yml's own step already covers that case).
#
# Keep this around for: forcing a full resubmission (submit_all) after
# manually editing public/_redirects or similar, or re-running submission if
# the automatic step in deploy.yml failed (continue-on-error there, by
# design — IndexNow must never block a production deploy).

on:
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Force full resubmission of every sitemap URL (ignore change detection)"
        type: boolean
        required: false
        default: false

concurrency:
  group: seo-indexnow
  cancel-in-progress: false

env:
  SITE_HOST: isitsafetotravel.org
  INDEXNOW_KEY: b4f7e2a1d9c8365f
  INDEXNOW_KEY_LOCATION: https://isitsafetotravel.org/b4f7e2a1d9c8365f.txt
  CHUNK_SIZE: "500"
  SLEEP_SECONDS: "5"

jobs:
  index-now:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy scores to public
        run: |
          if [ -f "data/scores/latest.json" ]; then
            cp data/scores/latest.json public/scores.json
          fi

      # `npm run build` chains generate:og (~400s, regenerates 248 PNGs) +
      # generate:llms + astro build + validate:seo. This workflow only needs
      # the prerendered HTML + sitemaps to hash and diff: og:image meta tags
      # are static path strings (they never depend on the PNG files
      # existing), and llms.txt / llms-full.txt are committed in public/.
      # `npx astro build` is sufficient — and much faster — here.
      - name: Build site (HTML only, skips OG regeneration and SEO validation)
        run: npx astro build

      # actions/cache keys are immutable, so save under a per-run key and
      # rely on the restore-keys prefix to pick up the most recent manifest
      # — shared with deploy.yml's own IndexNow step, same prefix.
      - name: Restore URL->hash manifest from previous run
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/manifest.tsv
          key: indexnow-manifest-${{ github.run_id }}
          restore-keys: |
            indexnow-manifest-

      - name: Submit changed (or all) URLs to IndexNow
        id: indexnow
        env:
          SUBMIT_ALL: ${{ inputs.submit_all }}
        run: scripts/indexnow/submit-changed.sh dist/client

      # Runs only when submission succeeded, so the cached manifest always
      # reflects the last state that was FULLY submitted. If submission
      # fails, the old manifest survives and the same URLs are retried next run.
      - name: Save URL->hash manifest
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .indexnow/manifest.tsv
          key: indexnow-manifest-${{ github.run_id }}
